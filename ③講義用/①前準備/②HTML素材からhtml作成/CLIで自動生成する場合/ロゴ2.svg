<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a3a"/>
      <stop offset="1" stop-color="#3b2f7a"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#ffab68"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b0a24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="800" rx="56" fill="url(#bg)"/>
  <circle cx="400" cy="420" r="340" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- ears -->
    <path d="M150 340 L212 148 L336 246 Z" fill="#ffb978" stroke="#ffb978" stroke-width="28" stroke-linejoin="round"/>
    <path d="M650 340 L588 148 L464 246 Z" fill="#ffb978" stroke="#ffb978" stroke-width="28" stroke-linejoin="round"/>
    <path d="M188 290 L218 205 L283 255 Z" fill="#ff8fa3" stroke="#ff8fa3" stroke-width="14" stroke-linejoin="round"/>
    <path d="M612 290 L582 205 L517 255 Z" fill="#ff8fa3" stroke="#ff8fa3" stroke-width="14" stroke-linejoin="round"/>

    <!-- head -->
    <path d="M104 410 C104 285 190 232 400 232 C610 232 696 285 696 410 C696 570 580 686 400 686 C220 686 104 570 104 410 Z" fill="url(#fur)"/>
  </g>

  <!-- forehead stripes -->
  <g stroke="#e9894a" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M400 258 L400 308"/>
    <path d="M352 264 L360 304"/>
    <path d="M448 264 L440 304"/>
  </g>

  <!-- cheek marks -->
  <g stroke="#ff6b81" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M610 440 L628 478"/>
    <path d="M644 432 L662 470"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="288" cy="410" rx="50" ry="44" fill="#ffffff"/>
    <circle cx="298" cy="414" r="22" fill="#1b1a3a"/>
    <circle cx="306" cy="406" r="7" fill="#ffffff"/>
    <ellipse cx="512" cy="410" rx="50" ry="44" fill="#ffffff"/>
    <circle cx="502" cy="414" r="22" fill="#1b1a3a"/>
    <circle cx="510" cy="406" r="7" fill="#ffffff"/>
    <!-- grumpy lids -->
    <path d="M232 356 L346 392 L346 360 L232 330 Z" fill="url(#fur)"/>
    <path d="M568 356 L454 392 L454 360 L568 330 Z" fill="url(#fur)"/>
    <path d="M232 358 L344 394" stroke="#1b1a3a" stroke-width="12" stroke-linecap="round"/>
    <path d="M568 358 L456 394" stroke="#1b1a3a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- tear drop -->
  <path d="M252 470 C252 470 232 496 232 510 C232 522 241 530 252 530 C263 530 272 522 272 510 C272 496 252 470 252 470 Z" fill="#6ec6ff"/>
  <ellipse cx="246" cy="508" rx="4" ry="7" fill="#ffffff" opacity="0.7"/>

  <!-- muzzle -->
  <ellipse cx="400" cy="520" rx="78" ry="56" fill="#fff1de" opacity="0.9"/>

  <!-- nose -->
  <path d="M370 484 Q400 470 430 484 Q416 512 400 516 Q384 512 370 484 Z" fill="#ff6b81" stroke="#ff6b81" stroke-width="6" stroke-linejoin="round"/>

  <!-- frown -->
  <g stroke="#1b1a3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M400 516 L400 540"/>
    <path d="M340 586 Q366 542 400 540 Q434 542 460 586"/>
  </g>

  <!-- whiskers -->
  <g stroke="#1b1a3a" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <path d="M308 510 L170 494"/>
    <path d="M310 534 L180 548"/>
    <path d="M492 510 L630 494"/>
    <path d="M490 534 L620 548"/>
  </g>
</svg>
